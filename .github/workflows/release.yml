name: Build and release firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          # Pinned, because an unpinned library turns this build into a
          # different binary from the one that was tested by hand.
          arduino-cli lib install \
            "Adafruit GFX Library@1.13.0" "Adafruit SSD1306@2.5.17" \
            "FluxGarage RoboEyes@1.1.1" "ArduinoJson@7.4.3" \
            "NimBLE-Arduino@2.5.1"
          # Releases built here use the stock core, which has no power
          # management. They run, but without light sleep: Bluetooth
          # drops whenever the screen goes dark, as in 5.20. Build with
          # the light-sleep core patch (see HANDOFF.md) for the full 6.0.

      # A tag ending in -test builds the stripped input test sketch instead
      # of the real firmware. The asset keeps its name either way, because
      # that is what the firmware already out there looks for.
      - name: Choose the sketch
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-test ]]; then
            echo "SKETCH=rafiq_test" >> $GITHUB_ENV
          else
            echo "SKETCH=nexus_face" >> $GITHUB_ENV
          fi

      - name: Compile
        run: |
          echo "building $SKETCH"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc \
            --output-dir out "$SKETCH"
          cp "out/$SKETCH.ino.bin" nexus_face.bin
          ls -l nexus_face.bin

      - name: Check the tag matches FW_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FW=$(grep -oE '#define FW_VERSION "[^"]+"' "$SKETCH/$SKETCH.ino" | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          echo "sketch=$SKETCH  FW_VERSION=$FW  tag=$TAG"
          [ "$FW" = "$TAG" ] || { echo "::error::FW_VERSION ($FW) != tag ($TAG)"; exit 1; }

      # The release assets are built by hand, with the full FQBN above and
      # whatever core the release calls for, then uploaded. CI must not
      # replace one that is already there. In 7.13.0 it did: nexus_face.bin
      # was uploaded and checksum verified at 15:18, and this job quietly
      # overwrote it at 15:21 with its own build. Nobody would have seen it
      # except by weighing the asset.
      - name: Publish only if the release has no binary yet
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' | grep -qx 'nexus_face.bin'; then
            echo "nexus_face.bin is already on $TAG. Leaving it alone."
            exit 0
          fi
          echo "No binary on $TAG yet, uploading this build."
          gh release upload "$TAG" nexus_face.bin --repo "$GITHUB_REPOSITORY"
