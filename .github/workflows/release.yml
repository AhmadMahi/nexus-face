name: Build and release firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306" \
            "FluxGarage RoboEyes" "ArduinoJson"

      # A tag ending in -test builds the stripped input test sketch instead
      # of the real firmware. The asset keeps its name either way, because
      # that is what the firmware already out there looks for.
      - name: Choose the sketch
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-test ]]; then
            echo "SKETCH=rafiq_test" >> $GITHUB_ENV
          else
            echo "SKETCH=nexus_face" >> $GITHUB_ENV
          fi

      - name: Compile
        run: |
          echo "building $SKETCH"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
            --output-dir out "$SKETCH"
          cp "out/$SKETCH.ino.bin" nexus_face.bin
          ls -l nexus_face.bin

      - name: Check the tag matches FW_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FW=$(grep -oE '#define FW_VERSION "[^"]+"' "$SKETCH/$SKETCH.ino" | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          echo "sketch=$SKETCH  FW_VERSION=$FW  tag=$TAG"
          [ "$FW" = "$TAG" ] || { echo "::error::FW_VERSION ($FW) != tag ($TAG)"; exit 1; }

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: nexus_face.bin
          prerelease: false
          generate_release_notes: true
